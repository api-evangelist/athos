name: Athos
description: Athos is a sports performance technology company founded in 2012 and based in Redwood City,
  California, that builds athletic apparel with embedded surface electromyography (EMG) sensors. Its
  garments and snap-on Athos Core module capture muscle activity, effort, and motion data, streaming it
  over Bluetooth to a mobile app and coaching dashboard so athletes, trainers, and sports scientists can
  measure muscular exertion, fatigue, and return-to-play readiness in real time. Athos is a consumer and
  team hardware brand with no publicly documented developer API; this profile was surfaced as a portfolio
  company of Lightspeed Venture Partners and enriched for the API Evangelist network.
